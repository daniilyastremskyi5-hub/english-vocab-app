<script>
    // Interaction effects
    document.querySelectorAll('.glass-panel, .glass-card, .glass-button').forEach(el => {
        el.addEventListener('mousemove', (e) => {
            const rect = el.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            el.style.setProperty('--mouse-x', `${x}px`);
            el.style.setProperty('--mouse-y', `${y}px`);
        });
    });

    // Close panel animation logic (simulated)
    document.addEventListener('click', (e) => {
        const drawer = document.querySelector('aside');
        const overlay = document.querySelector('.bg-primary\\/10');
        if (!drawer.contains(e.target) && !e.target.closest('button')) {
            drawer.style.transform = 'translateX(-105%)';
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 500);
        }
    });
</script>
